<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>simple todo</title>
    <link href="./src/output.css" rel="stylesheet" />
  </head>
  <body class="bg-gray-800 text-white">
    <header class="flex justify-center">
      <div class="w-[80%] md:w-[60%] lg:w-[40%] mt-[30px] mb-5 pb-5 border-b border-gray-700">
        <h1 class="text-center text-3xl font-bold">Simple<span class="text-lime-400">Todo</span></h1>
        <form class="mt-[20px] flex justify-center">
          <input class="bg-gray-800 outline-none p-2 pl-3 w-[70%] border border-r-0 border-gray-700 rounded-l-lg placeholder:text-sm" type="text" placeholder="Type anything.." />
          <button id="post" class="bg-lime-500 hover:bg-lime-400 pl-3 pr-3 rounded-r-lg cursor-pointer" type="submit">Post</button>
        </form>
      </div>
    </header>

    <!-- THE LIST OF TO DO -->
    <main class="flex justify-center">
      <ul class="w-[80%] md:w-[60%] lg:w-[40%]">
        <!-- <li class="bg-gray-700 mb-2 flex justify-between p-2 rounded-lg">
          <span class="done-list inline-block cursor-pointer">${content.value}</span><span class="delete-list text-red-500 hover:text-red-600 inline-block cursor-pointer">x</span>
        </li> -->
      </ul>
    </main>

    <script src="src/script.js"></script>
  </body>
</html>
